<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Little World ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Serif+TC:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap');
:root{--pink:#d995b2;--deep:#a85f83;--pale:#fff7fa;--ink:#735565;--line:#f0dce5;--lav:#e9e2f4;--blue:#e2eff5;--cream:#fff0dc}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12% 8%,#fff 0 2px,transparent 3px),linear-gradient(135deg,#fff8fb,#fff2f7 55%,#f8f3fb);color:var(--ink);font-family:'Noto Serif TC',serif}
button,input,textarea{font:inherit}
.topbar{max-width:1100px;margin:auto;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:italic 22px 'DM Serif Display',serif;color:var(--deep);letter-spacing:.4px}
.mode-switch{display:flex;gap:7px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:30px;box-shadow:0 5px 18px #b77b9812}
.mode-switch button{border:0;background:transparent;color:#a17b8d;padding:9px 15px;border-radius:22px;cursor:pointer;font-size:13px}
.mode-switch button.active{background:#f5dce7;color:#995875}
main{max-width:1000px;margin:0 auto;padding:10px 24px 70px}
.hero{text-align:center;padding:48px 16px 24px;position:relative}
.eyebrow{font:italic 14px 'DM Serif Display',serif;color:#bd8da4;letter-spacing:2px}
h1{font:italic clamp(42px,8vw,72px) 'DM Serif Display',serif;color:#bd7898;margin:9px 0 8px;font-weight:400;text-shadow:0 3px 0 #fff}
.subtitle{font-size:14px;color:#a98798;letter-spacing:2px}
.hero:before,.hero:after{content:"✧";position:absolute;color:#d8aec1;font-size:27px}
.hero:before{left:17%;top:42px}.hero:after{right:17%;bottom:35px}
.nav-garden{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:25px 30px;padding:20px 5px 46px}
.shape-link{--shape:#f3d5e2;position:relative;border:0;background:var(--shape);color:#895a72;cursor:pointer;display:grid;place-items:center;text-align:center;font-size:14px;font-weight:600;letter-spacing:1px;filter:drop-shadow(0 5px 5px #b9829b20);transition:transform .2s,filter .2s}
.shape-link:hover{transform:translateY(-6px) rotate(-2deg) scale(1.04);filter:drop-shadow(0 9px 8px #b9829b30)}
.flower{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#f9e8bb 0 20%,transparent 21%),radial-gradient(ellipse at 50% 13%,var(--shape) 0 25%,transparent 26%),radial-gradient(ellipse at 87% 38%,var(--shape) 0 25%,transparent 26%),radial-gradient(ellipse at 75% 83%,var(--shape) 0 25%,transparent 26%),radial-gradient(ellipse at 25% 83%,var(--shape) 0 25%,transparent 26%),radial-gradient(ellipse at 13% 38%,var(--shape) 0 25%,transparent 26%);background-color:transparent}
.flower span{position:relative;z-index:1;margin-top:0;text-shadow:0 1px #fff8}
.cloud{width:145px;height:82px;border-radius:48px;background:var(--shape);margin-top:20px}
.cloud:before,.cloud:after{content:"";position:absolute;background:var(--shape);border-radius:50%}
.cloud:before{width:73px;height:73px;left:20px;top:-32px}.cloud:after{width:91px;height:91px;right:17px;top:-43px}
.cloud span{position:relative;z-index:1;margin-top:17px}
.butterfly{width:130px;height:110px;background:transparent;filter:none}
.butterfly:before,.butterfly:after{content:"";position:absolute;top:10px;width:59px;height:78px;background:var(--shape);filter:drop-shadow(0 4px 3px #b9829b20)}
.butterfly:before{left:5px;border-radius:80% 18% 65% 35%;transform:rotate(17deg)}
.butterfly:after{right:5px;border-radius:18% 80% 35% 65%;transform:rotate(-17deg)}
.butterfly span{z-index:2;background:#fff8;border-radius:20px;padding:5px 7px;font-size:12px;position:relative}
.section{background:#ffffffc9;border:1px solid #f1dfe7;border-radius:25px;padding:26px;margin:15px 0;box-shadow:0 12px 35px #b77b9810;scroll-margin-top:20px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.section h2{font:italic 27px 'DM Serif Display',serif;color:#b87595;margin:0}
.section small{color:#bd9aaa}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:13px;color:#986d82}
input,textarea{width:100%;border:1px solid #ecd9e2;background:#fffafd;border-radius:13px;padding:11px 13px;color:#745667;outline:none}
input:focus,textarea:focus{border-color:#d99db7;box-shadow:0 0 0 3px #f8e7ef}
textarea{min-height:92px;resize:vertical}
.display-value{white-space:pre-wrap;line-height:1.9;color:#806778;background:#fffafd;border-radius:13px;padding:12px 14px;min-height:45px}
.empty{color:#c2a8b5;font-style:italic}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.action{border:0;border-radius:22px;padding:10px 17px;background:#f2dce6;color:#925c77;cursor:pointer}
.action.secondary{background:#f0ebf6;color:#87749b}
.action.danger{background:#fbe9e9;color:#a66c72}
.edit-only{display:none}
body.editing .edit-only{display:flex}
body.editing .display-only{display:none}
body.editing .nav-garden{opacity:.92}
.add-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.custom-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.custom-card{background:#fffafd;border:1px dashed #e8cbd9;border-radius:16px;padding:14px}
.custom-card h3{margin:0 0 9px;color:#aa7190;font-size:16px}
.custom-card p{white-space:pre-wrap;line-height:1.8;margin:0}
.footer{text-align:center;color:#bd94a8;font:italic 14px 'DM Serif Display',serif;padding:30px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#8d6379;color:white;padding:10px 17px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:620px){.topbar{padding:15px}.brand{font-size:18px}main{padding:0 14px 45px}.hero{padding-top:35px}.hero:before{left:5%}.hero:after{right:5%}.nav-garden{gap:17px 13px;padding-bottom:28px}.flower{width:94px;height:94px}.cloud{width:122px;height:70px}.butterfly{width:108px;height:94px}.butterfly:before,.butterfly:after{width:50px;height:68px}.section{padding:19px 16px}.field-grid,.custom-list{grid-template-columns:1fr}.section h2{font-size:24px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">♡ My Little World</div>
  <div class="mode-switch" aria-label="切換模式">
    <button id="editMode" type="button">✎ 編輯</button>
    <button id="viewMode" class="active" type="button">♡ 展示</button>
  </div>
</header>
<main>
  <section class="hero">
    <div class="eyebrow">WELCOME TO</div>
    <h1 id="heroTitle">My Little World ♡</h1>
    <div class="subtitle" id="heroSubtitle">一個收藏著我的喜好與日常的小角落</div>
    <div class="edit-only" style="justify-content:center;margin-top:18px">
      <input id="titleInput" aria-label="網站主標題" value="My Little World ♡" style="max-width:340px;text-align:center">
    </div>
  </section>

  <nav class="nav-garden" aria-label="介紹分類">
    <button class="shape-link flower" style="--shape:#f2cddd" data-target="about"><span>關於我</span></button>
    <button class="shape-link butterfly" style="--shape:#e5d9f1" data-target="interests"><span>興趣愛好</span></button>
    <button class="shape-link cloud" style="--shape:#dcecf3" data-target="favorites"><span>我的喜好</span></button>
    <button class="shape-link flower" style="--shape:#f6e3b9" data-target="daily"><span>生活日常</span></button>
    <button class="shape-link butterfly" style="--shape:#f2d7dc" data-target="collection"><span>我的收藏</span></button>
    <button class="shape-link cloud" style="--shape:#e7e1f2" data-target="dreams"><span>未來願望</span></button>
  </nav>

  <section class="section" id="about">
    <div class="section-head"><h2>About Me</h2><small>✧ 認識我 ✧</small></div>
    <div class="field-grid">
      <div class="field"><label>名字／暱稱</label><input data-key="name" placeholder="想讓大家怎麼稱呼你？"></div>
      <div class="field"><label>生日</label><input data-key="birthday" placeholder="例如：6 月 28 日"></div>
      <div class="field"><label>星座／MBTI</label><input data-key="type" placeholder="例如：巨蟹座 / INFP"></div>
      <div class="field"><label>我的關鍵字</label><input data-key="keywords" placeholder="例如：慢熟、好奇、喜歡幻想"></div>
      <div class="field full"><label>自我介紹</label><textarea data-key="intro" placeholder="寫下一段關於自己的介紹吧……"></textarea></div>
    </div>
    <div class="display-only field-grid">
      <div class="field"><label>名字／暱稱</label><div class="display-value" data-show="name"></div></div>
      <div class="field"><label>生日</label><div class="display-value" data-show="birthday"></div></div>
      <div class="field"><label>星座／MBTI</label><div class="display-value" data-show="type"></div></div>
      <div class="field"><label>我的關鍵字</label><div class="display-value" data-show="keywords"></div></div>
      <div class="field full"><label>自我介紹</label><div class="display-value" data-show="intro"></div></div>
    </div>
  </section>

  <section class="section" id="interests">
    <div class="section-head"><h2>My Interests</h2><small>✧ 喜歡做的事 ✧</small></div>
    <div class="field-grid">
      <div class="field"><label>興趣</label><textarea data-key="hobbies" placeholder="例如：寫作、畫畫、聽音樂……"></textarea></div>
      <div class="field"><label>擅長的事</label><textarea data-key="skills" placeholder="有什麼事情是你很拿手的？"></textarea></div>
    </div>
    <div class="display-only field-grid">
      <div class="field"><label>興趣</label><div class="display-value" data-show="hobbies"></div></div>
      <div class="field"><label>擅長的事</label><div class="display-value" data-show="skills"></div></div>
    </div>
  </section>

  <section class="section" id="favorites">
    <div class="section-head"><h2>My Favorites</h2><small>✧ 喜歡的小事物 ✧</small></div>
    <div class="field-grid">
      <div class="field"><label>喜歡的顏色</label><input data-key="color" placeholder="例如：粉色、淡紫色"></div>
      <div class="field"><label>喜歡的食物</label><input data-key="food" placeholder="填上最喜歡的食物"></div>
      <div class="field"><label>喜歡的動物</label><input data-key="animal" placeholder="例如：貓咪"></div>
      <div class="field"><label>喜歡的音樂／歌手</label><input data-key="music" placeholder="歌名、歌手或曲風"></div>
      <div class="field full"><label>其他喜歡的事物</label><textarea data-key="otherLikes" placeholder="任何想分享的小喜好……"></textarea></div>
    </div>
    <div class="display-only field-grid">
      <div class="field"><label>喜歡的顏色</label><div class="display-value" data-show="color"></div></div>
      <div class="field"><label>喜歡的食物</label><div class="display-value" data-show="food"></div></div>
      <div class="field"><label>喜歡的動物</label><div class="display-value" data-show="animal"></div></div>
      <div class="field"><label>喜歡的音樂／歌手</label><div class="display-value" data-show="music"></div></div>
      <div class="field full"><label>其他喜歡的事物</label><div class="display-value" data-show="otherLikes"></div></div>
    </div>
  </section>

  <section class="section" id="daily">
    <div class="section-head"><h2>Little Moments</h2><small>✧ 日常紀錄 ✧</small></div>
    <div class="field"><label>想分享的日常</label><textarea data-key="daily" placeholder="記錄最近發生的有趣小事、生活片段……"></textarea></div>
    <div class="display-only"><label>想分享的日常</label><div class="display-value" data-show="daily"></div></div>
  </section>

  <section class="section" id="collection">
    <div class="section-head"><h2>My Collection</h2><small>✧ 珍藏的事物 ✧</small></div>
    <div class="field"><label>我的收藏</label><textarea data-key="collection" placeholder="例如：喜歡的書、動漫、角色、作品……"></textarea></div>
    <div class="display-only"><label>我的收藏</label><div class="display-value" data-show="collection"></div></div>
  </section>

  <section class="section" id="dreams">
    <div class="section-head"><h2>My Dreams</h2><small>✧ 想去的遠方 ✧</small></div>
    <div class="field"><label>夢想與目標</label><textarea data-key="dreams" placeholder="未來想完成的事情、想去的地方……"></textarea></div>
    <div class="display-only"><label>夢想與目標</label><div class="display-value" data-show="dreams"></div></div>
  </section>

  <section class="section" id="customSection">
    <div class="section-head"><h2>More About Me</h2><small>✧ 自訂專屬欄位 ✧</small></div>
    <div class="custom-list" id="customList"></div>
    <div class="edit-only add-row">
      <input id="customTitle" placeholder="欄位名稱，例如：我的小目標" style="flex:1;min-width:180px">
      <button class="action" id="addCustom" type="button">＋ 新增介紹欄位</button>
    </div>
    <p class="display-only empty" id="noCustom">還沒有自訂欄位，之後可以在編輯模式新增 ♡</p>
  </section>

  <div class="actions edit-only" style="justify-content:center">
    <button class="action" id="saveBtn" type="button">♡ 儲存資料</button>
    <button class="action secondary" id="exportBtn" type="button">下載備份</button>
    <button class="action danger" id="resetBtn" type="button">清空資料</button>
  </div>
  <div class="footer">made with love & little dreams ♡</div>
</main>
<div class="toast" id="toast">已儲存 ♡</div>
<script>
const $=(s,root=document)=>root.querySelector(s);
const $$=(s,root=document)=>[...root.querySelectorAll(s)];
const STORAGE='my-little-world-profile-v1';
let customFields=[];
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function getData(){const data={title:$('#titleInput').value,fields:{}};$$('[data-key]').forEach(el=>data.fields[el.dataset.key]=el.value);data.custom=customFields.map((f,i)=>({title:f.title,value:$('#custom-'+i)?.value??f.value??''}));return data}
function save(show=true){localStorage.setItem(STORAGE,JSON.stringify(getData()));render();if(show)toast('已儲存 ♡')}
function render(){
 const data=getData();$('#heroTitle').textContent=data.title||'My Little World ♡';
 $$('[data-show]').forEach(el=>{const v=data.fields[el.dataset.show]||'';el.textContent=v||'尚未填寫';el.classList.toggle('empty',!v)});
 const list=$('#customList');list.innerHTML='';
 customFields.forEach((f,i)=>{
  const card=document.createElement('div');card.className='custom-card';
  const h=document.createElement('h3');h.textContent=f.title;
  const p=document.createElement('p');const v=$('#custom-'+i)?.value??f.value??'';p.textContent=v||'尚未填寫';
  const input=document.createElement('textarea');input.id='custom-'+i;input.placeholder='寫下你想介紹的內容……';input.value=v;input.className='edit-only';input.style.marginTop='8px';
  input.addEventListener('input',()=>{f.value=input.value;p.textContent=input.value||'尚未填寫'});
  const del=document.createElement('button');del.className='action danger edit-only';del.type='button';del.textContent='刪除此欄位';del.style.marginTop='8px';del.onclick=()=>{customFields.splice(i,1);render()};
  card.append(h,p,input,del);list.append(card);
 });
 $('#noCustom').style.display=customFields.length?'none':'block';
 document.body.classList.toggle('editing',document.body.classList.contains('editing'));
}
const EDIT_PASSWORD = 'mili628user';

function switchMode(edit){
 if(edit){
  document.body.classList.add('editing');
  $('#editMode').classList.add('active');
  $('#viewMode').classList.remove('active');
 }else{
  save(false);
  document.body.classList.remove('editing');
  $('#editMode').classList.remove('active');
  $('#viewMode').classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
 }
}

$('#editMode').onclick=()=>{
 if(document.body.classList.contains('editing')) return;
 const password=window.prompt('請輸入編輯密碼 ♡');
 if(password===null) return;
 if(password===EDIT_PASSWORD){
  switchMode(true);
  toast('已進入編輯模式 ♡');
 }else{
  toast('密碼錯誤，無法進入編輯模式');
 }
};
$('#viewMode').onclick=()=>switchMode(false);
$$('.shape-link').forEach(btn=>btn.addEventListener('click',()=>$('#'+btn.dataset.target).scrollIntoView({behavior:'smooth',block:'start'})));
$('#titleInput').addEventListener('input',()=>$('#heroTitle').textContent=$('#titleInput').value||'My Little World ♡');
$('#addCustom').onclick=()=>{const title=$('#customTitle').value.trim();if(!title){toast('先替新欄位取個名字吧');return}customFields.push({title,value:''});$('#customTitle').value='';render();save(false)};
$('#saveBtn').onclick=()=>save(true);
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(getData(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-little-world-backup.json';a.click();URL.revokeObjectURL(a.href);toast('備份檔已準備好 ♡')};
$('#resetBtn').onclick=()=>{if(confirm('確定要清空目前填寫的資料嗎？此動作無法復原。')){localStorage.removeItem(STORAGE);location.reload()}};
try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved){$('#titleInput').value=saved.title||'My Little World ♡';Object.entries(saved.fields||{}).forEach(([k,v])=>{const el=$(`[data-key="${k}"]`);if(el)el.value=v});customFields=saved.custom||[]}}catch(e){}
render();
</script>
</body>
</html>
